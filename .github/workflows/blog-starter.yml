name: Blog Starter

# Build once, deploy the same artifact everywhere:
#   pull request -> build + type check -> preview environment on the dev Static Web App
#   main         -> build -> dev -> (approval) -> prod
# Deploy jobs are skipped until Azure is connected (see infrastructure/README.md).

on:
  push:
    branches: [main]
    paths:
      - 'modified/blog-starter/**'
      - '.github/workflows/blog-starter.yml'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - 'modified/blog-starter/**'
      - '.github/workflows/blog-starter.yml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write   # Static Web Apps posts the preview URL on the PR

defaults:
  run:
    working-directory: modified/blog-starter

jobs:
  build:
    name: Build and test
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: modified/blog-starter/package-lock.json

      - name: Install (locked versions)
        run: npm ci

      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Build static site
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Production URL, used for absolute Open Graph image links. The same build is
          # promoted to every environment, so it always points at production.
          SITE_URL: ${{ vars.BLOG_SITE_URL }}

      - uses: actions/upload-artifact@v7
        with:
          name: blog-site
          path: modified/blog-starter/out
          retention-days: 14

  preview:
    name: PR preview
    needs: build
    if: github.event_name == 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blog-site
          path: site

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa
        working-directory: .
        run: |
          NAME=$(az deployment group show -g "${{ vars.BLOG_RESOURCE_GROUP }}" -n blog-starter --query properties.outputs.staticWebAppName.value -o tsv)
          TOKEN=$(az staticwebapp secrets list --name "$NAME" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true

  close-preview:
    name: Remove PR preview
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa
        working-directory: .
        run: |
          NAME=$(az deployment group show -g "${{ vars.BLOG_RESOURCE_GROUP }}" -n blog-starter --query properties.outputs.staticWebAppName.value -o tsv)
          TOKEN=$(az staticwebapp secrets list --name "$NAME" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: close

  deploy-dev:
    name: Deploy (dev)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AZURE_CLIENT_ID != ''
    runs-on: ubuntu-latest
    environment:
      name: dev
      url: ${{ steps.swa.outputs.url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blog-site
          path: site

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa
        working-directory: .
        run: |
          NAME=$(az deployment group show -g "${{ vars.BLOG_RESOURCE_GROUP }}" -n blog-starter --query properties.outputs.staticWebAppName.value -o tsv)
          HOST=$(az staticwebapp show --name "$NAME" --query defaultHostname -o tsv)
          TOKEN=$(az staticwebapp secrets list --name "$NAME" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "url=https://$HOST" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true
          deployment_environment: ''   # production environment of this Static Web App

      - name: Smoke test
        working-directory: .
        run: |
          for path in / /posts/hello-world/; do
            curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
              -o /dev/null -w "%{http_code} $path\n" "${{ steps.swa.outputs.url }}$path"
          done

  deploy-prod:
    name: Deploy (prod)
    needs: deploy-dev
    runs-on: ubuntu-latest
    environment:
      name: prod   # protected: requires an approval
      url: ${{ steps.swa.outputs.url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: blog-site
          path: site

      - uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Get deployment token
        id: swa
        working-directory: .
        run: |
          NAME=$(az deployment group show -g "${{ vars.BLOG_RESOURCE_GROUP }}" -n blog-starter --query properties.outputs.staticWebAppName.value -o tsv)
          HOST=$(az staticwebapp show --name "$NAME" --query defaultHostname -o tsv)
          TOKEN=$(az staticwebapp secrets list --name "$NAME" --query properties.apiKey -o tsv)
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
          echo "url=https://$HOST" >> "$GITHUB_OUTPUT"

      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ steps.swa.outputs.token }}
          action: upload
          app_location: site
          skip_app_build: true
          skip_api_build: true
          deployment_environment: ''   # production environment of this Static Web App

      - name: Smoke test
        working-directory: .
        run: |
          for path in / /posts/hello-world/; do
            curl --fail --silent --show-error --retry 5 --retry-delay 10 --retry-all-errors \
              -o /dev/null -w "%{http_code} $path\n" "${{ steps.swa.outputs.url }}$path"
          done
